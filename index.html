<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Turnero — General y Preferencial</title>

  <!-- Fuente opcional -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
  :root{
    --bg:#f4f7fb;
    --card:#fff;
    --muted:#6b7280;
    --accent:#0f6fff;
    --accent-2:#0ea5a4;
    --danger:#ef4444;
    --radius:12px;
    --shadow: 0 8px 30px rgba(12,20,40,0.08);
    --text:#0f1724;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background: linear-gradient(180deg,var(--bg), #eef6ff 300px);
    color:var(--text);
    min-height:100vh;
  }

  /* Layout */
  .app{
    max-width:1100px;
    margin:28px auto;
    padding:18px;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
  }
  .brand{display:flex;gap:12px;align-items:center}
  .brand h1{margin:0;font-size:1.4rem}
  .brand .muted{font-size:0.9rem;color:var(--muted);margin-top:2px}
  .logo{width:46px;height:46px;border-radius:10px;padding:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:white;flex-shrink:0}

  /* Controls inline */
  .controls-panel{margin-bottom:14px}
  .settings-inline{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
    background:var(--card);
    padding:10px 12px;
    border-radius:10px;
    box-shadow:var(--shadow);
  }
  .settings-inline label{font-size:0.9rem;color:var(--muted);display:flex;flex-direction:column}
  .settings-inline input[type="text"], .settings-inline select{
    padding:8px 10px;border-radius:8px;border:1px solid #e6eef8;min-width:90px;margin-top:6px;
  }
  .toggle{display:flex;align-items:center;gap:8px;font-size:0.9rem}

  /* Boards */
  .boards{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:18px;
  }
  .board{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .board-header{display:flex;justify-content:space-between;align-items:center}
  .board-sub{color:var(--muted);font-size:0.85rem}
  .display{
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:2.8rem;
    padding:18px;
    border-radius:10px;
    color:var(--accent);
    background:linear-gradient(90deg,#f0f7ff, #ffffff);
    border:1px solid #e6f0ff;
    min-height:84px;
  }
  .display.small{font-size:2rem}

  /* Buttons */
  .board-actions{display:flex;gap:10px;justify-content:center}
  .board-small{display:flex;gap:8px;justify-content:center}
  .btn{
    padding:10px 14px;border-radius:10px;border:1px solid #e6eef8;background:transparent;cursor:pointer;font-weight:600;
  }
  .btn.primary{background:var(--accent);color:#fff;border:none;box-shadow:0 8px 20px rgba(15,111,255,0.16)}
  .btn.secondary{background:#eef2ff;color:var(--accent);border:1px solid #dbeafe}
  .btn.call{background:#0c7c59;color:#fff;border:none}
  .btn.ghost{background:transparent;border:1px solid #e6eef8}
  .btn.danger{background:var(--danger);color:#fff;border:none}

  /* History */
  .history{margin-top:6px}
  .history h3{margin:4px 0;color:var(--muted);font-size:0.95rem}
  .history-list{margin:8px 0 0;padding-left:18px;max-height:160px;overflow:auto;list-style:decimal}

  /* Footer */
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted)}
  .footer-right{display:flex;gap:12px;align-items:center}

  /* Settings drawer */
  .drawer{
    position:fixed;right:18px;top:18px;width:320px;max-width:92vw;height:calc(100vh - 36px);
    background:linear-gradient(180deg,var(--card),#fafcff);border-radius:12px;padding:12px;box-shadow:0 30px 80px rgba(10,20,40,0.12);
    transform:translateY(-20px) scale(.98);opacity:0;pointer-events:none;transition:all .22s ease;
  }
  .drawer[aria-hidden="false"]{transform:none;opacity:1;pointer-events:auto}
  .drawer-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px dashed #eef4ff}
  .drawer-body{padding-top:10px;display:flex;flex-direction:column;gap:10px}
  .drawer-body label{font-size:0.95rem;color:var(--muted);display:flex;flex-direction:column}
  .drawer-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}

  /* Modal */
  .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,12,20,0.4);opacity:0;pointer-events:none;transition:opacity .18s}
  .modal[aria-hidden="false"]{opacity:1;pointer-events:auto}
  .modal-card{background:var(--card);padding:18px;border-radius:12px;min-width:280px;max-width:92vw;box-shadow:var(--shadow)}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

  /* Small screen */
  @media (max-width:980px){
    .boards{grid-template-columns:1fr;align-items:start}
    .brand h1{font-size:1.1rem}
  }

  /* Dark theme */
  body.dark{
    --bg:#071025;
    --card:#071427;
    --muted:#9aa6b2;
    --accent:#2aa0ff;
    --accent-2:#17d4c9;
    --text:#e6f0ff;
    background: linear-gradient(180deg,#031026,#041226 300px);
  }
  body.dark .logo{background:linear-gradient(135deg,var(--accent),var(--accent-2))}

  /* helper */
  .icon-btn{background:transparent;border:none;border-radius:8px;padding:8px;cursor:pointer}
  .kbd-help{font-size:0.85rem;color:var(--muted)}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2L2 7v6c0 5 4 9 10 9s10-4 10-9V7l-10-5z"></path></svg>
        <div>
          <h1>Turnero</h1>
          <p class="muted">General • Preferencial — con voz y persistencia</p>
        </div>
      </div>

      <div class="top-actions">
        <div class="kbd-help">Atajos: G / Shift+G = General ↑/↓ · P / Shift+P = Pref ↑/↓</div>
        <button id="settings-toggle" class="icon-btn" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.9 4a7.9 7.9 0 01-.1 1.3l2.1 1.6-1.8 3.1-2.5-.9a7.7 7.7 0 01-1.2.7l-.4 2.6h-3.6l-.4-2.6a7.7 7.7 0 01-1.2-.7l-2.5.9-1.8-3.1 2.1-1.6A7.9 7.9 0 013.1 12 7.9 7.9 0 015.2 10.7L3.1 9.1 4.9 6 7.4 6.9c.4-.3.8-.6 1.2-.9L9 3h3.6l.4 2.6c.4.3.8.6 1.2.9l2.5-.9L20.9 9l-2.1 1.6c.2.4.3.8.2 1.4z"/></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="controls-panel">
        <div class="settings-inline">
          <label>Prefijo General
            <input id="prefix-general" type="text" maxlength="4" value="G">
          </label>
          <label>Prefijo Preferencial
            <input id="prefix-prefer" type="text" maxlength="4" value="P">
          </label>
          <label>Relleno dígitos
            <select id="pad-digits">
              <option value="2">2 (01)</option>
              <option value="3" selected>3 (001)</option>
              <option value="4">4 (0001)</option>
            </select>
          </label>
          <label class="toggle">
            <input id="announce-on-advance" type="checkbox" checked>
            Anunciar al avanzar
          </label>
        </div>
      </section>

      <section class="boards">
        <article class="board" data-queue="general" aria-labelledby="title-general">
          <div class="board-header">
            <h2 id="title-general">General</h2>
            <div class="board-sub">Uso general</div>
          </div>
          <div class="display" id="display-general" aria-live="polite">G-000</div>

          <div class="board-actions">
            <button class="btn secondary prev" data-action="prev" title="Retroceder">◀ Retroceder</button>
            <button class="btn primary next" data-action="next" title="Siguiente">▶ Siguiente</button>
            <button class="btn call" data-action="call" title="Llamar sin avanzar">🔊 Llamar</button>
          </div>

          <div class="board-small">
            <button class="btn ghost" data-action="reset">Reiniciar</button>
            <button class="btn danger" data-action="clear">Borrar historial</button>
          </div>

          <div class="history">
            <h3>Últimos llamados</h3>
            <ol id="history-general" class="history-list" aria-live="polite"></ol>
          </div>
        </article>

        <article class="board" data-queue="preferencial" aria-labelledby="title-preferencial">
          <div class="board-header">
            <h2 id="title-preferencial">Preferencial</h2>
            <div class="board-sub">Atención prioritaria</div>
          </div>
          <div class="display small" id="display-preferencial" aria-live="polite">P-000</div>

          <div class="board-actions">
            <button class="btn secondary prev" data-action="prev" title="Retroceder">◀ Retroceder</button>
            <button class="btn primary next" data-action="next" title="Siguiente">▶ Siguiente</button>
            <button class="btn call" data-action="call" title="Llamar sin avanzar">🔊 Llamar</button>
          </div>

          <div class="board-small">
            <button class="btn ghost" data-action="reset">Reiniciar</button>
            <button class="btn danger" data-action="clear">Borrar historial</button>
          </div>

          <div class="history">
            <h3>Últimos llamados</h3>
            <ol id="history-preferencial" class="history-list" aria-live="polite"></ol>
          </div>
        </article>
      </section>
    </main>

    <footer class="footer">
      <div>
        <small id="version">Versión local — Turnero</small>
      </div>
      <div class="footer-right">
        <button id="clear-all" class="btn ghost">Limpiar todo</button>
        <label class="theme-toggle">
          <input id="theme-toggle" type="checkbox">
          Modo oscuro
        </label>
      </div>
    </footer>

    <!-- Settings drawer -->
    <aside id="settings-drawer" class="drawer" aria-hidden="true">
      <header class="drawer-header">
        <h3>Ajustes avanzados</h3>
        <button id="drawer-close" class="icon-btn" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.3 5.71L12 12l6.3 6.29-1.41 1.41L10.59 13.4 4.29 19.7 2.88 18.29 9.18 12 2.88 5.71 4.29 4.3 10.59 10.6 16.88 4.3z"/></svg></button>
      </header>

      <div class="drawer-body">
        <label>Voz (selecciona una)</label>
        <select id="voice-select"></select>

        <label>Volumen: <span id="volume-value">1.0</span></label>
        <input id="voice-volume" type="range" min="0" max="1" step="0.1" value="1">

        <label>Beep antes de anunciar
          <input id="play-beep" type="checkbox" checked>
        </label>

        <label>Intervalo de repetición automática (seg) — 0 para desactivar
          <input id="auto-repeat-interval" type="number" min="0" step="1" value="0">
        </label>

        <div class="drawer-actions">
          <button id="save-settings" class="btn primary">Guardar</button>
          <button id="reset-settings" class="btn ghost">Restaurar valores</button>
        </div>
      </div>
    </aside>

    <!-- Modal -->
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-card">
        <p id="modal-message"></p>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn ghost">Cancelar</button>
          <button id="modal-confirm" class="btn danger">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  // Turnero moderno — Todo en un solo archivo
  (function () {
    const STORAGE_KEY = 'turnero_modern_v1';
    const DEFAULT = {
      general: { counter: 0, history: [] },
      preferencial: { counter: 0, history: [] },
      settings: {
        prefix_general: 'G',
        prefix_prefer: 'P',
        pad: 3,
        announceOnAdvance: true,
        voiceIndex: 0,
        volume: 1,
        playBeep: true,
        autoRepeatInterval: 0
      },
      ui: { dark: false }
    };

    // Elements
    const $ = (id) => document.getElementById(id);
    const elems = {
      displayGeneral: $('display-general'),
      displayPrefer: $('display-preferencial'),
      historyGeneral: $('history-general'),
      historyPrefer: $('history-preferencial'),
      prefixGeneral: $('prefix-general'),
      prefixPrefer: $('prefix-prefer'),
      padDigits: $('pad-digits'),
      settingsToggle: $('settings-toggle'),
      settingsDrawer: $('settings-drawer'),
      drawerClose: $('drawer-close'),
      saveSettings: $('save-settings'),
      resetSettings: $('reset-settings'),
      voiceSelect: $('voice-select'),
      voiceVolume: $('voice-volume'),
      volumeValue: $('volume-value'),
      playBeep: $('play-beep'),
      announceOnAdvance: $('announce-on-advance'),
      autoRepeatInterval: $('auto-repeat-interval'),
      modal: $('modal'),
      modalMessage: $('modal-message'),
      modalCancel: $('modal-cancel'),
      modalConfirm: $('modal-confirm'),
      clearAll: $('clear-all'),
      themeToggle: $('theme-toggle'),
      settingsInlinePad: $('pad-digits'),
      settingsToggleBtn: $('settings-toggle'),
      saveSettingsBtn: $('save-settings')
    };

    // state
    let state = loadState();
    let voices = [];
    let autoRepeatTimers = {};

    // voice population
    function populateVoices() {
      voices = speechSynthesis.getVoices() || [];
      elems.voiceSelect.innerHTML = '';
      if (voices.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = 'TTS no disponible';
        elems.voiceSelect.appendChild(opt);
        elems.voiceSelect.disabled = true;
        return;
      }
      voices.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${v.name} — ${v.lang}${v.default ? ' (pred.)' : ''}`;
        elems.voiceSelect.appendChild(opt);
      });
      elems.voiceSelect.value = state.settings.voiceIndex ?? 0;
    }
    if ('speechSynthesis' in window) {
      populateVoices();
      speechSynthesis.onvoiceschanged = populateVoices;
    } else {
      elems.voiceSelect.innerHTML = '<option>TTS no disponible</option>';
      elems.voiceSelect.disabled = true;
    }

    // storage helpers
    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.warn('No se pudo guardar', e); }
    }
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT));
        const parsed = JSON.parse(raw);
        // Merge into default to avoid missing fields
        const merged = JSON.parse(JSON.stringify(DEFAULT));
        Object.assign(merged.settings, parsed.settings || {});
        merged.general = Object.assign(merged.general, parsed.general || {});
        merged.preferencial = Object.assign(merged.preferencial, parsed.preferencial || {});
        merged.ui = Object.assign(merged.ui, parsed.ui || {});
        // histories
        merged.general.history = (parsed.general && parsed.general.history) ? parsed.general.history : merged.general.history;
        merged.preferencial.history = (parsed.preferencial && parsed.preferencial.history) ? parsed.preferencial.history : merged.preferencial.history;
        return merged;
      } catch (e) {
        console.warn('Error cargando estado, usando default.', e);
        return JSON.parse(JSON.stringify(DEFAULT));
      }
    }

    // formatting
    function formatNumber(prefix, num) {
      const pad = Number(state.settings.pad) || 3;
      return `${prefix}-${String(num).padStart(pad, '0')}`;
    }

    // UI apply
    function applyTheme() {
      if (state.ui.dark) document.body.classList.add('dark'); else document.body.classList.remove('dark');
      elems.themeToggle.checked = state.ui.dark;
    }

    function renderAll() {
      elems.prefixGeneral.value = state.settings.prefix_general;
      elems.prefixPrefer.value = state.settings.prefix_prefer;
      elems.padDigits.value = state.settings.pad;
      elems.announceOnAdvance.checked = !!state.settings.announceOnAdvance;
      elems.voiceVolume.value = state.settings.volume ?? 1;
      elems.volumeValue.textContent = Number(state.settings.volume ?? 1).toFixed(1);
      elems.playBeep.checked = !!state.settings.playBeep;
      elems.autoRepeatInterval.value = state.settings.autoRepeatInterval || 0;
      elems.voiceSelect.value = state.settings.voiceIndex ?? 0;

      updateDisplay('general');
      updateDisplay('preferencial');
      renderHistory('general');
      renderHistory('preferencial');
      applyTheme();
      saveState();
    }

    function updateDisplay(queue) {
      const prefix = queue === 'general' ? state.settings.prefix_general : state.settings.prefix_prefer;
      const el = queue === 'general' ? elems.displayGeneral : elems.displayPrefer;
      el.textContent = formatNumber(prefix, state[queue].counter || 0);
    }

    function renderHistory(queue) {
      const ul = queue === 'general' ? elems.historyGeneral : elems.historyPrefer;
      ul.innerHTML = '';
      (state[queue].history || []).slice().reverse().forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        ul.appendChild(li);
      });
    }

    // core actions
    function pushHistory(queue, label) {
      state[queue].history = state[queue].history || [];
      state[queue].history.push(label);
      if (state[queue].history.length > 200) state[queue].history.shift();
    }

    function advance(queue, announce = true) {
      state[queue].counter = (Number(state[queue].counter) || 0) + 1;
      const prefix = queue === 'general' ? state.settings.prefix_general : state.settings.prefix_prefer;
      const label = formatNumber(prefix, state[queue].counter);
      pushHistory(queue, label);
      updateDisplay(queue); renderHistory(queue); saveState();
      if (announce && state.settings.announceOnAdvance) announceTurn(label, queue);
      scheduleAutoRepeat(queue);
    }

    function retreat(queue) {
      state[queue].counter = Math.max(0, (Number(state[queue].counter) || 0) - 1);
      updateDisplay(queue); saveState();
      cancelAutoRepeat(queue);
    }

    function resetCounter(queue) {
      state[queue].counter = 0; updateDisplay(queue); saveState();
      cancelAutoRepeat(queue);
    }

    function clearHistory(queue) {
      state[queue].history = []; renderHistory(queue); saveState();
      cancelAutoRepeat(queue);
    }

    // modal confirm returns Promise<boolean>
    function confirmModal(message) {
      return new Promise(resolve => {
        elems.modalMessage.textContent = message;
        elems.modal.setAttribute('aria-hidden', 'false');
        function onCancel() { cleanup(false); }
        function onConfirm() { cleanup(true); }
        function cleanup(val) {
          elems.modal.setAttribute('aria-hidden', 'true');
          elems.modalCancel.removeEventListener('click', onCancel);
          elems.modalConfirm.removeEventListener('click', onConfirm);
          resolve(val);
        }
        elems.modalCancel.addEventListener('click', onCancel);
        elems.modalConfirm.addEventListener('click', onConfirm);
      });
    }

    // Audio / TTS
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        const idx = Number(state.settings.voiceIndex) || 0;
        if (voices[idx]) ut.voice = voices[idx];
        ut.lang = ut.voice?.lang || 'es-ES';
        ut.volume = Number(state.settings.volume) ?? 1;
        ut.rate = 1;
        ut.pitch = 1;
        speechSynthesis.speak(ut);
      } catch (e) {
        console.warn('TTS fallo', e);
      }
    }

    function beepThenSpeak(text) {
      const shouldBeep = !!state.settings.playBeep;
      if (!shouldBeep) { speak(text); return; }
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(880, ctx.currentTime);
        g.gain.setValueAtTime(0, ctx.currentTime);
        o.connect(g); g.connect(ctx.destination);
        g.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 0.01);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.18);
        o.stop(ctx.currentTime + 0.2);
        setTimeout(() => speak(text), 280);
      } catch (e) {
        speak(text);
      }
    }

    function announceTurn(label, queue) {
      const phrase = `Atención, ${label}`;
      beepThenSpeak(phrase);
      const el = queue === 'general' ? elems.displayGeneral : elems.displayPrefer;
      try {
        el.animate([{ boxShadow: '0 0 0 0 rgba(15,111,255,0.0)' }, { boxShadow: '0 0 0 14px rgba(15,111,255,0.06)' }], { duration: 700 });
      } catch (e) {}
    }

    // auto repeat
    function scheduleAutoRepeat(queue) {
      cancelAutoRepeat(queue);
      const interval = Number(state.settings.autoRepeatInterval) || 0;
      if (!interval || interval <= 0) return;
      autoRepeatTimers[queue] = setInterval(() => {
        const prefix = queue === 'general' ? state.settings.prefix_general : state.settings.prefix_prefer;
        const label = formatNumber(prefix, state[queue].counter || 0);
        if (label) {
          pushHistory(queue, label);
          renderHistory(queue);
          saveState();
          announceTurn(label, queue);
        }
      }, interval * 1000);
    }
    function cancelAutoRepeat(queue) {
      if (autoRepeatTimers[queue]) { clearInterval(autoRepeatTimers[queue]); delete autoRepeatTimers[queue]; }
    }

    // event delegation for boards
    document.querySelectorAll('.board').forEach(board => {
      board.addEventListener('click', async (ev) => {
        const btn = ev.target.closest('button');
        if (!btn) return;
        const action = btn.dataset.action;
        const queue = board.dataset.queue;
        if (action === 'next') advance(queue, true);
        if (action === 'prev') retreat(queue);
        if (action === 'reset') {
          if (await confirmModal(`¿Reiniciar contador de ${queue}?`)) resetCounter(queue);
        }
        if (action === 'clear') {
          if (await confirmModal(`¿Borrar historial de ${queue}?`)) clearHistory(queue);
        }
        if (action === 'call') {
          const prefix = queue === 'general' ? state.settings.prefix_general : state.settings.prefix_prefer;
          const label = formatNumber(prefix, state[queue].counter || 0);
          if (label) {
            pushHistory(queue, label);
            renderHistory(queue);
            saveState();
            announceTurn(label, queue);
          }
        }
      });
    });

    // settings drawer
    elems.settingsToggle.addEventListener('click', () => {
      const open = elems.settingsDrawer.getAttribute('aria-hidden') === 'false';
      elems.settingsDrawer.setAttribute('aria-hidden', (!open).toString());
    });
    elems.drawerClose.addEventListener('click', () => elems.settingsDrawer.setAttribute('aria-hidden', 'true'));

    // save settings
    elems.saveSettings.addEventListener('click', () => {
      state.settings.prefix_general = elems.prefixGeneral.value.trim() || 'G';
      state.settings.prefix_prefer = elems.prefixPrefer.value.trim() || 'P';
      state.settings.pad = Number(elems.padDigits.value) || 3;
      state.settings.voiceIndex = Number(elems.voiceSelect.value) || 0;
      state.settings.volume = Number(elems.voiceVolume.value) || 1;
      state.settings.playBeep = !!elems.playBeep.checked;
      state.settings.announceOnAdvance = !!elems.announceOnAdvance.checked;
      state.settings.autoRepeatInterval = Number(elems.autoRepeatInterval.value) || 0;
      elems.volumeValue.textContent = Number(state.settings.volume).toFixed(1);
      updateDisplay('general'); updateDisplay('preferencial'); renderHistory('general'); renderHistory('preferencial');
      saveState();
      elems.settingsDrawer.setAttribute('aria-hidden', 'true');
    });

    elems.resetSettings.addEventListener('click', () => {
      if (!confirm('Restaurar valores por defecto?')) return;
      state = JSON.parse(JSON.stringify(DEFAULT));
      renderAll();
    });

    // voice volume live update
    elems.voiceVolume.addEventListener('input', (e) => {
      elems.volumeValue.textContent = Number(e.target.value).toFixed(1);
    });

    elems.voiceSelect.addEventListener('change', () => {
      state.settings.voiceIndex = Number(elems.voiceSelect.value) || 0; saveState();
    });
    elems.voiceVolume.addEventListener('change', () => {
      state.settings.volume = Number(elems.voiceVolume.value) || 1; saveState();
    });

    // clear all
    elems.clearAll.addEventListener('click', async () => {
      if (await confirmModal('Limpiar todo (contadores e historiales)? Esta acción no se puede deshacer.')) {
        state = JSON.parse(JSON.stringify(DEFAULT));
        renderAll();
      }
    });

    // theme toggle
    elems.themeToggle.addEventListener('change', (e) => {
      state.ui.dark = !!e.target.checked; applyTheme(); saveState();
    });

    // keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.isContentEditable) return;
      const key = e.key.toLowerCase();
      if (key === 'g' && !e.shiftKey) { advance('general', true); }
      if (key === 'g' && e.shiftKey) { retreat('general'); }
      if (key === 'p' && !e.shiftKey) { advance('preferencial', true); }
      if (key === 'p' && e.shiftKey) { retreat('preferencial'); }
    });

    // initial render and resume auto repeat if needed
    renderAll();
    // restore auto repeat if configured
    if (Number(state.settings.autoRepeatInterval) > 0) {
      scheduleAutoRepeat('general');
      scheduleAutoRepeat('preferencial');
    }

    // expose minimal API for debugging
    window.turnero = {
      state,
      advance: (q='general') => advance(q),
      retreat: (q='general') => retreat(q),
      reset: (q='general') => resetCounter(q),
      clear: (q='general') => clearHistory(q),
      speak: (t) => speak(t)
    };
  })();
  </script>
</body>
</html>
