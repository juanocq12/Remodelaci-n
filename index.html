<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Turnero — General y Preferencial</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Turnero</h1>
      <p class="subtitle">General y Preferencial — control de turnos con voz y persistencia</p>
    </header>

    <section class="controls">
      <div class="settings">
        <label>
          Prefijo General:
          <input id="prefix-general" type="text" value="G" maxlength="4" />
        </label>
        <label>
          Prefijo Preferencial:
          <input id="prefix-prefer" type="text" value="P" maxlength="4" />
        </label>
        <label>
          Relleno de dígitos:
          <select id="pad-digits">
            <option value="2">2 (01)</option>
            <option value="3" selected>3 (001)</option>
            <option value="4">4 (0001)</option>
          </select>
        </label>
        <label>
          Voz:
          <select id="voice-select"></select>
        </label>
        <label>
          Volumen:
          <input id="voice-volume" type="range" min="0" max="1" step="0.1" value="1" />
        </label>
        <button id="open-settings" class="secondary">Guardar ajustes</button>
      </div>
    </section>

    <section class="boards">
      <div class="board" data-queue="general" aria-labelledby="general-title">
        <h2 id="general-title">General</h2>
        <div class="display" id="display-general" aria-live="polite">G-000</div>
        <div class="actions">
          <button class="btn prev" data-action="prev">◀ Retroceder</button>
          <button class="btn next primary" data-action="next">▶ Siguiente</button>
          <button class="btn call" data-action="call">🔊 Llamar</button>
        </div>
        <div class="actions small">
          <button class="btn warn" data-action="reset">Reiniciar</button>
          <button class="btn danger" data-action="clear">Borrar historial</button>
        </div>
        <div class="history">
          <h3>Últimos llamados</h3>
          <ol id="history-general" class="history-list" aria-live="polite"></ol>
        </div>
      </div>

      <div class="board" data-queue="preferencial" aria-labelledby="pref-title">
        <h2 id="pref-title">Preferencial</h2>
        <div class="display" id="display-preferencial" aria-live="polite">P-000</div>
        <div class="actions">
          <button class="btn prev" data-action="prev">◀ Retroceder</button>
          <button class="btn next primary" data-action="next">▶ Siguiente</button>
          <button class="btn call" data-action="call">🔊 Llamar</button>
        </div>
        <div class="actions small">
          <button class="btn warn" data-action="reset">Reiniciar</button>
          <button class="btn danger" data-action="clear">Borrar historial</button>
        </div>
        <div class="history">
          <h3>Últimos llamados</h3>
          <ol id="history-preferencial" class="history-list" aria-live="polite"></ol>
        </div>
      </div>
    </section>

    <footer class="footer">
      <small>Creado por Turnero — Voz via Web Speech API. Usa un navegador moderno.</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
