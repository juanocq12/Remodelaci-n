<script type="text/plain" id="gs">
// Extensiones > Apps Script > pega este código > Implementar > Nueva implementación > Aplicación web
// Ejecutar como: Yo | Acceso: Cualquier usuario. Copia la URL /exec en Ajustes de la app.
const H = {
  Actividades: ['id','fecha','hora','titulo','categoria','prioridad','avance','estado','notas','repite','hechas','subtareas','actualizado','foto'],
  Gastos: ['id','fecha','concepto','categoria','monto','actualizado'],
  Enfoque: ['id','fecha','minutos','actualizado'],
  Config: ['id','valor','actualizado']
};
function sh_(n) {
  const ss = SpreadsheetApp.getActive();
  let s = ss.getSheetByName(n);
  if (!s) {
    s = ss.insertSheet(n);
    s.getRange(1, 1, s.getMaxRows(), H[n].length).setNumberFormat('@');
    s.appendRow(H[n]); s.setFrozenRows(1);
  }
  return s;
}
function rows_(n) {
  const v = sh_(n).getDataRange().getValues(); v.shift();
  return v.filter(r => r[0]).map(r => { const o = {}; H[n].forEach((c, i) => o[c] = String(r[i] == null ? '' : r[i])); return o; });
}
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function doGet() { return out_({ ok: true, Actividades: rows_('Actividades'), Gastos: rows_('Gastos'), Enfoque: rows_('Enfoque'), Config: rows_('Config') }); }
function doPost(e) {
  const lock = LockService.getScriptLock(); lock.waitLock(10000);
  try {
    const b = JSON.parse(e.postData.contents), s = sh_(b.hoja), cols = H[b.hoja];
    if (b.action === 'foto') {
      const it = DriveApp.getFoldersByName('Control Actividades - Fotos');
      const fol = it.hasNext() ? it.next() : DriveApp.createFolder('Control Actividades - Fotos');
      const f = fol.createFile(Utilities.newBlob(Utilities.base64Decode(b.item.data.split(',')[1]), 'image/jpeg', b.item.id + '.jpg'));
      f.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
      return out_({ ok: true, url: 'https://drive.google.com/thumbnail?id=' + f.getId() + '&sz=w800' });
    }
    const ids = s.getRange(1, 1, s.getLastRow(), 1).getValues().flat().map(String);
    const row = ids.indexOf(b.item.id) + 1;
    if (b.action === 'delete') { if (row > 1) s.deleteRow(row); return out_({ ok: true }); }
    b.item.actualizado = new Date().toISOString();
    const vals = cols.map(c => String(b.item[c] == null ? '' : b.item[c]));
    if (row > 1) s.getRange(row, 1, 1, cols.length).setValues([vals]); else s.appendRow(vals);
    return out_({ ok: true });
  } catch (err) { return out_({ ok: false, error: String(err) }); }
  finally { lock.releaseLock(); }
}
</script>

<script>
const URL_FIJA='';/* pega aquí tu URL /exec para que funcione en cualquier dispositivo sin configurar */
const NOMBRE='Juan Manuel',CC={Trabajo:'#3d6a9e',Estudio:'#5f7f9f',Proyectos:'#8a7a9f',Personal:'#a08a5f',Salud:'#5a9a7a',Finanzas:'#a06a6a'};
const CATS=['Trabajo','Estudio','Proyectos','Personal','Salud','Finanzas'],GCATS=['Comida','Transporte','Hogar','Estudio','Ocio','Otros'];
const $=s=>document.querySelector(s),LS=(()=>{try{localStorage.setItem('_t','1');return localStorage}catch(e){return{}}})(),J=(k,d)=>{try{return JSON.parse(LS[k])||d}catch(e){return d}};
const iso=d=>{const z=new Date(d-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date()),esc=s=>String(s??'').replace(/[&<>\"]+/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(d,o)=>new Date(d+'T00:00').toLocaleDateString('es-CO',o),cop=n=>(+n||0).toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
let S={items:J('items',[]),gastos:J('gastos',[]),q:J('q',[]),foco:J('foco',{}),cfg:J('cfg',{}),bq:'',alta:false,view:'hoy',sel:today(),cur:new Date(),cat:'Todas',url:LS.url||URL_FIJA};
const save=()=>{LS.items=JSON.stringify(S.items);LS.gastos=JSON.stringify(S.gastos);LS.q=JSON.stringify(S.q);LS.foco=JSON.stringify(S.foco);LS.cfg=JSON.stringify(S.cfg)};
const sync=m=>$('#sy').textContent=m;
function toast(m,a,fn){const t=$('#toast');t.innerHTML=esc(m)+(a?` <button class="ta" id="tb">${a}</button>`:'');t.style.display='block';if(a)$('#tb').onclick=()=>{fn();t.style.display='none'};clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}

/* ---------- sincronización con Google Sheets ---------- */
async function api(b){if(!S.url)return false;try{const r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)});return (await r.json()).ok}catch(e){return false}}
async function flush(){if(!S.url)return;if(flush.b){flush.again=1;return}flush.b=1;try{const snap=S.q.slice(),rest=[];for(const b of snap){if(b.hoja=='Actividades'&&b.action=='upsert'&&(b.item.foto||'').startsWith('data:')){try{const r=await(await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({hoja:'Actividades',action:'foto',item:{id:b.item.id,data:b.item.foto}})})).json();if(r.ok){b.item.foto=r.url;const it=S.items.find(i=>i.id===b.item.id);if(it)it.foto=r.url}else b.item={...b.item,foto:''}}catch(e){rest.push(b);continue}}if(!await api(b))rest.push(b)}S.q=[...rest,...S.q.filter(x=>!snap.includes(x))];save();sync(S.q.length?'Pendiente de sincronizar ('+S.q.length+')':'Guardado en la hoja ✓')}finally{flush.b=0;if(flush.again){flush.again=0;flush()}}}
async function load(){if(!S.url){sync('Modo local · conecta tu hoja en Ajustes');render();return}sync('Sincronizando…');try{await flush();if(S.q.some(b=>!['Enfoque','Config'].includes(b.hoja)))throw 0;const r=await(await fetch(S.url)).json();if(!r.ok)throw 0;const sa=r.Actividades.map(x=>({...x,avance:+x.avance||0})),sg=r.Gastos,la=S.items.filter(x=>!sa.some(y=>y.id===x.id)),lg=S.gastos.filter(x=>!sg.some(y=>y.id===x.id));sa.forEach(y=>{const l=S.items.find(x=>x.id===y.id);if(l&&(l.foto||'').startsWith('data:')&&!hasF(y)){y.foto=l.foto;S.q.push({hoja:'Actividades',action:'upsert',item:y})}});la.forEach(x=>S.q.push({hoja:'Actividades',action:'upsert',item:x}));lg.forEach(x=>S.q.push({hoja:'Gastos',action:'upsert',item:x}));S.items=[...sa,...la];S.gastos=[...sg,...lg];if(r.Enfoque)S.foco=r.Enfoque.reduce((a,x)=>{a[x.fecha]=+x.minutos||0;return a},{})
;sync('Sincronizado '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}))}catch(e){sync('Sin conexión · pendientes: '+S.q.length)}render()}
async function push(hoja,action,item){S.q.push({hoja,action,item});save();render();await flush();sync(S.q.length?'Pendiente de sincronizar ('+S.q.length+')':'Guardado en la hoja ✓')}

/* ---------- gamificación, enfoque y registro rápido ---------- */
const LV=[[0,'Novato'],[100,'Aprendiz'],[500,'Experto'],[1500,'Maestro'],[5000,'Leyenda'],[15000,'Inmortal']];
const focoMin=()=>Object.values(S.foco).reduce((a,b)=>a+b,0);
const hechasTot=()=>S.items.reduce((a,x)=>a+(x.repite?hech(x).length:x.estado==='Hecha'?1:0),0);
const xpTotal=()=>hechasTot()*10+focoMin();
function level(){const xp=xpTotal();let i=0;LV.forEach((l,k)=>{if(xp>=l[0])i=k});const n=LV[i+1];return{n:LV[i][1],next:n?n[0]:0,nn:n?n[1]:'',p:n?(xp-LV[i][0])/(n[0]-LV[i][0])*100:100}}
function dayStat(k){const l=S.items.filter(x=>occurs(x,k));return{n:l.length,d:l.filter(x=>isDone(x,k)).length}}
function streak(){let c=0;for(let i=0;i<120;i++){const d=new Date();d.setDate(d.getDate()-i);const r=dayStat(iso(d));if(r.n&&r.d==r.n)c++;else if(i>0||r.n)break}return c}
let T={m:'foco',left:1500,run:false,iv:null,end:0};
const fmtT=()=>String(Math.floor(T.left/60)).padStart(2,'0')+':'+String(T.left%60).padStart(2,'0')+(T.m=='desc'?' · descanso':'');
function tgl(){T.run=!T.run;if(T.run){T.end=Date.now()+T.left*1000;T.iv=setInterval(tick,500)}else clearInterval(T.iv);render()}
function rst(){clearInterval(T.iv);T={m:'foco',left:1500,run:false,iv:null,end:0};render()}
function tick(){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));if(T.left<=0){clearInterval(T.iv);T.run=false;navigator.vibrate&&navigator.vibrate([200,100,200]);if(T.m=='foco'){S.foco[today()]=(S.foco[today()]||0)+25;push('Enfoque','upsert',{id:today(),fecha:today(),minutos:S.foco[today()]});toast('Sesión de enfoque completada · +25 XP');T.m='desc';T.left=300;T.run=true;T.end=Date.now()+300000;T.iv=setInterval(tick,500)}else{toast('Descanso terminado');T.m='foco';T.left=1500;T.run=false;render();return}}const e=$('#tm');if(e)e.textContent=fmtT();render()}
const hasF=x=>/^(https?:|data:)/.test(x.foto||'');
function parseT(t){let f=null,h='',p='Media',c='Personal',m;const now=new Date(),sw=r=>{t=t.replace(r,'')};
  const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],DIA=['domingo','lunes','martes','miércoles','miercoles','jueves','viernes','sábado','sabado'];
  if(/\bmañana\b/i.test(t)){const d=new Date();d.setDate(d.getDate()+1);f=iso(d);sw(/\bmañana\b/i)}else if(/\bhoy\b/i.test(t)){f=today();sw(/\bhoy\b/i)}

const subs=x=>{try{return JSON.parse(x.subtareas||'[]')}catch(e){return[]}},hech=x=>(x.hechas||'').split(',').filter(Boolean);

function card(x,d){const dn=isDone(x,d),s=subs(x),p=prog(x,d),late=!x.repite&&x.fecha<today()&&!dn;return `<div class="card act ${dn?'done':''}" style="--cc:${CC[x.categoria]||'#8b5cf6'}"><div class="row"><button class="chk" aria-label="Completar" onclick="toggle('${x.id}','${d}')">${dn?'✓':''}</button><div class="grow" onclick="edit('${x.id}')"><div class="t">${esc(x.titulo)}</div><div class="m">${x.hora?x.hora+' · ':''}${esc(x.categoria)}${x.repite?' · ↻ '+x.repite:''}${late?' · <span style="color:var(--bad)">vencida</span>':''}</div></div>${hasF(x)?`<img class="th" src="${esc(x.foto)}" alt="Foto" loading="lazy">`:''}<span class="pill p-${x.prioridad}">${x.prioridad}</span></div>${!x.repite&&s.length?s.map((t,i)=>`<label class="sb"><input type="checkbox" ${t.d?'checked':''} onchange="tsub('${x.id}',${i})">${esc(t.t)}</label>`).join(''):''}${!x.repite&&p>0&&p<100?`<div class="bar"><i style="width:${p}%"></i></div>`:''}</div>`}

function vGas(){const ym=iso(S.cur).slice(0,7),l=S.gastos.filter(x=>x.fecha.startsWith(ym)).sort((a,b)=>b.fecha.localeCompare(a.fecha)),tot=l.reduce((a,x)=>a+ +x.monto,0);$('#h').textContent='Gastos';$('#sub').textContent='Control diario de dinero';return `<div class="card"><div class="row"><button class="btn g" onclick="mv(-1)">‹</button><div class="grow" style="text-align:center"><div class="m" style="text-transform:capitalize">${S.cur.toLocaleDateString('es-CO',{month:'long',year:'numeric'})}</div><div class="t">Total ${cop(tot)}</div></div><button class="btn g" onclick="mv(1)">›</button></div>${bud(tot)}<div class="lb">MOVIMIENTOS</div>${l.map(x=>`<div class="card"><div class="row" onclick="gedit('${x.id}')"><div class="grow"><div class="t">${esc(x.concepto)}</div><div class="m">${fmt(x.fecha,{day:'numeric',month:'short'})} · ${esc(x.categoria)}</div></div><div class="t">${cop(x.monto)}</div></div></div>`).join('')||'<div class="empty">Sin movimientos</div>'}<div class="row" style="margin-top:8px"><button class="btn" onclick="gedit()">+ Nuevo gasto</button></div></div>`}

function vPro(){$('#h').textContent='Logros';$('#sub').textContent='Mide, ajusta, repite';const w=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return iso(d)}),t=today(),ws=w.map(dayStat),tn=ws.reduce((a,x)=>a+x.n,0),td=ws.reduce((a,x)=>a+x.d,0);const st=streak(),lv=level(),xp=xpTotal(),ht=hechasTot(),late=S.items.filter(x=>!x.repite&&x.fecha<t&&x.estado!='Hecha').length;const bars=w.map((k,i)=>{const p=ws[i].n?ws[i].d/ws[i].n*100:0;return `<div style="flex:1;text-align:center"><div style="height:80px;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.max(8,Math.round(p))}%;background:var(--ac);border-radius:6px 6px 0 0"></div></div><div class="m" style="margin-top:6px">${new Date(k+'T00:00').toLocaleDateString('es-CO',{day:'numeric'})}</div></div>`}).join('');const B=[['','Racha 3',st>=3],['','Racha 7',st>=7],['','Racha 30',st>=30],['','10 hechas',ht>=10],['','100 hechas',ht>=100],['','Primer pomodoro',focoMin()>0],['','Primer gasto',S.gastos.length>0],['','Sin vencidas',late===0]];return `<div class="card"><div class="row"><div class="grow"><div style="font-size:12px;opacity:.9">NIVEL</div><div style="font-size:26px;font-weight:800">${lv.n}</div></div><div style="text-align:right"><div class="m">XP</div><div class="t">${xp}</div></div></div><div class="stats" style="margin-top:10px"><div class="card"><strong>${tn?Math.round(td/tn*100):0}%</strong><span class="m">cumplimiento semanal</span></div><div class="card"><strong>${st}</strong><span class="m">racha actual</span></div></div><div class="card"><div class="m">Últimos 7 días</div><div class="row" style="align-items:flex-end;margin-top:8px;gap:6px">${bars}</div></div><div class="card"><div class="m">Logros</div><div class="bdg">${B.map(b=>`<span class="${b[2]?'on':'off'}">${b[1]}</span>`).join('')}</div></div>${ins()}</div>`}

function vAj(){$('#h').textContent='Ajustes';$('#sub').textContent='Conexión con Google Sheets';return `<div class="card"><label>URL de la aplicación web (Apps Script, termina en /exec)</label><input id="url" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/.../exec"><div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="S.url=$('#url').value.trim();LS.url=S.url;load()">Guardar y sincronizar</button><button class="btn g" onclick="resetLocal()">Vaciar local</button></div></div><div class="card"><div class="t">Backend (Apps Script)</div><div class="m" style="margin:4px 0 10px">Copia este código en tu hoja: Extensiones › Apps Script. Crea las pestañas solo y guarda la URL /exec.</div><button class="chip" onclick="navigator.clipboard.writeText($('#gs').textContent)">Copiar script</button></div><div class="card"><div class="t">Plantillas de rutina</div><div class="m" style="margin:4px 0 10px">Crea de una vez los pasos como hábitos que se repiten.</div><div class="row" style="flex-wrap:wrap;gap:8px"><button class="chip" onclick="plantilla('manana')">Mañana</button><button class="chip" onclick="plantilla('noche')">Noche</button></div></div><div class="card"><div class="t">Bloqueo con PIN</div><div class="m" style="margin:4px 0 10px">${LS.pin?'Activado. Se pide al abrir y tras 1 minuto fuera de la app.':'Desactivado. Protege la app si compartes el celular.'}</div><div class="row" style="flex-wrap:wrap;gap:8px"><button class="chip" onclick="setPin()">${LS.pin?'Cambiar PIN':'Activar PIN'}</button>${LS.pin?`<button class="chip" onclick="noPin()">Desactivar</button>`:''}</div></div><div class="card"><div class="t">Apariencia</div><div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn g" onclick="setTheme('light')">Claro</button><button class="btn g" onclick="setTheme('dark')">Oscuro</button></div></div>`}
function resetLocal(){if(confirm('¿Vaciar datos locales?')){localStorage.clear();location.reload()}}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({actividades:S.items,gastos:S.gastos,enfoque:S.foco},null,1)],{type:'application/json'}));a.download='backup.json';a.click()}

function render(){const f={hoy:vHoy,cal:vCal,gas:vGas,pro:vPro,aj:vAj}[S.view];$('#v').innerHTML=f();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));$('.fab').style.display=S.view=='aj'||S.view=='pro'?'none':''}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render();scrollTo(0,0)});
$('#f_categoria').innerHTML=CATS.map(c=>`<option>${c}`).join('');$('#g_categoria').innerHTML=GCATS.map(c=>`<option>${c}`).join('');

/* ---------- formularios ---------- */
let cur=null;
function edit(id,fecha,pre){const x=id?find(id):{id:'a'+Date.now().toString(36),fecha:fecha||(S.view=='cal'?S.sel:today()),hora:'',titulo:'',categoria:'Trabajo',prioridad:'Media',avance:0,notas:'',repite:'',hechas:'',subtareas:'[]'};cur=x;for(const k of['titulo','fecha','hora','categoria','prioridad','repite','avance','notas'])$('#f_'+k).value=x[k]??'';$('#f_subtareas').value=subs(x).map(s=>s.t).join('\n');av.textContent=x.avance;$('#fotow').innerHTML=hasF(x)?`<img class="ph" src="${esc(x.foto)}" alt="Foto adjunta" onclick="window.open(this.src)">`:'';$('#del').style.display=id?'':'none';dlg.showModal()}
$('#sv').onclick=()=>{const t=$('#f_titulo').value.trim();if(!t)return $('#f_titulo').focus();const o={...cur};for(const k of['titulo','fecha','hora','categoria','prioridad','repite','notas'])o[k]=$('#f_'+k).value;const old=subs(cur),s=$('#f_subtareas').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>({t:l,d:!!old.find(z=>z.t==l&&z.d)}));o.subtareas=JSON.stringify(s);o.avance=s.length?Math.round(s.filter(z=>z.d).length/s.length*100):+$('#f_avance').value;dlg.close();upsert(o)};
$('#del').onclick=()=>{const x0={...cur};dlg.close();S.items=S.items.filter(x=>x.id!==x0.id);push('Actividades','delete',{id:x0.id});toast('Actividad eliminada','Deshacer',()=>upsert(x0))};
let gc=null;
function gedit(id){const x=id?S.gastos.find(g=>g.id===id):{id:'g'+Date.now().toString(36),fecha:today(),concepto:'',categoria:'Comida',monto:''};gc=x;for(const k of['concepto','monto','fecha','categoria'])$('#g_'+k).value=x[k]??'';$('#gdel').style.display=id?'':'none';gdlg.showModal()}
$('#gsv').onclick=()=>{const c=$('#g_concepto').value.trim();if(!c||!+$('#g_monto').value)return $('#g_concepto').focus();const o={...gc};for(const k of['concepto','monto','fecha','categoria'])o[k]=$('#g_'+k).value;gdlg.close();const i=S.gastos.findIndex(g=>g.id===o.id);i<0?S.gastos.push(o):S.gastos[i]=o;push('Gastos','upsert',o);chkPres()};
$('#gdel').onclick=()=>{gdlg.close();S.gastos=S.gastos.filter(g=>g.id!==gc.id);push('Gastos','delete',{id:gc.id})};

/* ---------- alertas por hora ---------- */
const fired={};
setInterval(()=>{const n=new Date(),k=iso(n),h=n.toTimeString().slice(0,5);S.items.filter(x=>x.hora===h&&occurs(x,k)&&!isDone(x,k)&&!fired[x.id+k+h]).forEach(x=>{fired[x.id+k+h]=1;toast(''+x.hora+' · '+x.titulo);if(window.Notification&&Notification.permission==='granted')new Notification(x.titulo,{body:x.categoria+' · '+x.prioridad})})},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.url)load()});
addEventListener('online',()=>load());
lock();render();load();
</script></body></html>
